# Builds the Windows app on GitHub's servers.
# - Push to any branch (or run it by hand): build and keep the files as a downloadable
#   artifact for testing, nothing is published.
# - Push a tag like v1.1.0: build and publish a GitHub release with the installer, the
#   portable exe and latest.json, which installed apps read to update themselves.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/slave

      - name: Install dependencies
        run: npm ci

      # The fake game process is embedded in the app, so it has to exist first
      - name: Build slave
        working-directory: src-tauri/slave
        run: cargo build --release

      # Signs the installer for the auto updater (keys stored as repository secrets)
      - name: Build app and installer
        run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "Disactivity.Steam_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" "out/$setup"
          Copy-Item "src-tauri/target/release/disactivity-steam.exe" "out/Disactivity.Steam_${version}_x64_portable.exe"

          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $signature = (Get-Content "src-tauri/target/release/bundle/nsis/*-setup.exe.sig" -Raw).Trim()
            @{
              version = $version
              notes = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                "windows-x86_64" = @{
                  signature = $signature
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$setup"
                }
              }
            } | ConvertTo-Json -Depth 4 | Set-Content out/latest.json -Encoding utf8NoBOM
          }

      - uses: actions/upload-artifact@v4
        with:
          name: disactivity-steam-${{ github.sha }}
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: RELEASE_NOTES.md
