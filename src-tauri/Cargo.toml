[package]
name = "disactivity-steam"
version = "1.2.1"
description = "Discord activity simulator with Steam library support, based on Disactivity by holasoyender"
authors = ["holasoyender", "K1tsune12"]
edition = "2021"
license = "MIT"
repository = "https://github.com/K1tsune12/disactivity-steam"
homepage = "https://github.com/K1tsune12/disactivity-steam"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "disactivity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "~2.3.4"
tauri-plugin-dialog = "~2.4.2"
# Newer releases of these plugin dependencies require Tauri 2.10, which would mix
# Tauri versions with the 2.9 used here (and its npm packages)
tauri-plugin-fs = "=2.4.4"
tauri-plugin-deep-link = "=2.4.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Media_Audio"] }

